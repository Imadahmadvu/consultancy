<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConsult - Login</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="bg-blur blur-1"></div>
  <div class="bg-blur blur-2"></div>

  <div class="login-card">
    <!-- LOGO  -->
    <div class="logo-area">
      <!-- <div class="logo-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div> -->
      <div class="logo-text">
        <img src="Connect.png" class="logo-img" alt="EduConsult">
        <p>Your Study Abroad Partner Here</p>
      </div>
    </div>

    <h2>Login to Your Account</h2>
    <p class="subtitle">Welcome back! Please login to continue</p>

    <form id="inquiryForm">
      <label>EMAIL ADDRESS</label>
      <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <label>PASSWORD</label>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="Enter your password" required>
        <i class="fa-regular fa-eye toggle-eye" id="togglePass"></i>
      </div>

      <div class="options">
        <label class="check"><input type="checkbox" checked> Remember Me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button id="submitBtn" type="submit" class="btn-login">Login <i class="fa-solid fa-arrow-right"></i></button>

      <div class="divider"><span>OR</span></div>

      <button type="button" class="btn-google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
        Continue with Google
      </button>

      <p class="register">Don't have an account? <a href="Register.html">Register Now</a></p>
    </form>
  </div>

<script>
  const toggle = document.getElementById('togglePass');
  const pass = document.getElementById('password');

  if (toggle && pass) {
    toggle.addEventListener('click', () => {
      const type = pass.type === 'password' ? 'text' : 'password';
      pass.type = type;
      toggle.classList.toggle('fa-eye');
      toggle.classList.toggle('fa-eye-slash');
    });
  }

  const loginForm = document.getElementById('inquiryForm');
  const submitBtn = document.getElementById('submitBtn');

  if (loginForm) {
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const emailInput = loginForm.querySelector('input[type="email"]');
      const email = emailInput ? emailInput.value.trim() : '';
      const passwordValue = pass ? pass.value : '';

      if (!email || !passwordValue) {
        alert('Please enter both email and password.');
        return;
      }

      if (submitBtn) submitBtn.disabled = true;

      try {
        // Note: Agar backend mein abhi sirf /api/inquiries route bana hai aur /api/auth/login nahi,
        // toh test ke liye /api/inquiries par log bhej sakte hain ya apna login endpoint use karein:
        const response = await fetch('http://localhost:5000/api/inquiries', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: email.split('@')[0] || 'User',
            email: email,
            phone: 'N/A',
            topic: 'Login Attempt',
            message: `Login attempt from ${email}`
          })
        });

        const result = await response.json();

        if (response.ok) {
          alert('Login request recorded successfully!');
          // Jab real login auth route banayein, yahan dashboard/home page par redirect kar sakte hain:
          // window.location.href = 'index.html';
        } else {
          alert(result.message || 'Login failed.');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Backend server (http://localhost:5000) se rabta nahi ho saka.');
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
